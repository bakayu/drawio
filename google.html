<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Drive Authentication</title>
    <script type="text/javascript">
        (function() {
            // Parse fragment/hash parameters (standard response for response_type=token)
            var hash = window.location.hash.substring(1);
            var params = {};
            if (hash) {
                var parts = hash.split('&');
                for (var i = 0; i < parts.length; i++) {
                    var pair = parts[i].split('=');
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            }

            // Fallback to query parameters in case of query redirect
            var query = window.location.search.substring(1);
            if (query) {
                var parts = query.split('&');
                for (var i = 0; i < parts.length; i++) {
                    var pair = parts[i].split('=');
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            }

            var authInfo = null;
            if (params.access_token) {
                authInfo = {
                    access_token: params.access_token,
                    expires_in: params.expires_in || 3600,
                    state: params.state
                };
            }

            if (window.opener != null && window.opener.onGoogleDriveCallback != null) {
                window.opener.onGoogleDriveCallback(authInfo, window);
            } else {
                document.write("Authentication complete. You can close this window.");
            }
        })();
    </script>
</head>
<body>
    <p>Authentication complete. Redirecting...</p>
</body>
</html>
